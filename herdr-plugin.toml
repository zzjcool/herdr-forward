# herdr-forward 插件 manifest —— herdr 0.9.x schema（RESEARCH.md §2.2 / SCOUT-FACTS §2.2）
#
# 路径解析策略（SCOUT-FACTS §2.2 裁决）：
#   `%{plugin_root}` 模板变量**不存在**（已证实），因此 command 一律用
#   `/bin/sh -c` 包装读取官方注入的 `$HERDR_PLUGIN_ROOT` env 后再 exec。
#   command 本身是 argv 数组、不经 shell —— 这里的 sh -c 是我们显式写出来的。
#
# TOML 注意：payload 里含双引号，故用 literal string（单引号）避免二次转义。
id = "zzjcool:forward"
name = "forward"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Forward a saved SSH machine's TCP port to localhost, and optionally publish a localhost port to the public internet via a Cloudflare quick tunnel."
platforms = ["linux", "macos"]

# ---------------------------------------------------------------------------
# build —— `herdr plugin install` 时运行（安装预览里可见）：装好键位并重载正在运行的
# herdr，装完即可按 prefix+f。startup hook 只在 server 启动时跑，往正在运行的 herdr 里
# 安装时不会触发；`herdr plugin link` 不跑 build（本地开发由下次启动的 startup hook 补）。
# ---------------------------------------------------------------------------

[[build]]
command = ["bash", "scripts/postinstall.sh"]

# ---------------------------------------------------------------------------
# startup hook —— OOTB：装好插件后自动补上 tab bar 状态条
#
# 职责（任务 §3）：herdr 在恢复会话、API socket ready 后跑一次（handoff 再跑）。
# tab_bar_right 属于 client 的 config，其中 command 在 server 上执行；同机时
# server config == 本机 config，钩子直接幂等地装；跨机时 server 碰不到 client
# 文件系统（物理边界），脚本降级为一行日志提示，恒 exit 0，绝不阻塞 server。
# 幂等与备份由 scripts/install-tabbar.sh 负责；脚本总览见 scripts/startup-hook.sh。
# ---------------------------------------------------------------------------

[[startup]]
command = ["/bin/sh", "-c", 'exec "${HERDR_PLUGIN_ROOT:?HERDR_PLUGIN_ROOT unset}/scripts/startup-hook.sh"']

# ---------------------------------------------------------------------------
# actions —— herdr command palette / keybinding / link_handler 的落点
# id 规则：ASCII letters/digits/`: . _ -`；action id 不能含点（SCOUT-FACTS §2.2）
# ---------------------------------------------------------------------------

[[actions]]
id = "add"
title = "Port Forward: Add…"
# herdr action invoke 不传 argv，交互式添加只能在面板里完成：
# 优先用 herdr CLI 打开 Port Forward 面板（HERDR_BIN_PATH 由 herdr 注入，SCOUT-FACTS §2.2）；
# CLI 不可用时退化为打印 add 用法提示，绝不静默失败。
command = ["/bin/sh", "-c", 'if [ -n "${HERDR_BIN_PATH:-}" ] && command -v "$HERDR_BIN_PATH" >/dev/null 2>&1; then exec "$HERDR_BIN_PATH" plugin pane open --plugin zzjcool:forward --entrypoint ports --placement popup; else exec "${HERDR_PLUGIN_ROOT:?HERDR_PLUGIN_ROOT unset}/bin/forward" add; fi']

[[actions]]
id = "list"
title = "Port Forward: List"
command = ["/bin/sh", "-c", 'exec "${HERDR_PLUGIN_ROOT:?HERDR_PLUGIN_ROOT unset}/bin/forward" list']

# remove：一期没有 `--pick` 交互实现（`forward remove --pick` 返回 exit 9），直接把它写成
# action 会是用户可见的「死按钮」。移除经 Port Forward 面板（pane/list）交互完成，故与 add
# 共用同一条 pane open 路径（打开 ports pane，用户在里面选中后按提示 remove <id>）。
[[actions]]
id = "remove"
title = "Port Forward: Remove…"
command = ["/bin/sh", "-c", 'if [ -n "${HERDR_BIN_PATH:-}" ] && command -v "$HERDR_BIN_PATH" >/dev/null 2>&1; then exec "$HERDR_BIN_PATH" plugin pane open --plugin zzjcool:forward --entrypoint ports --placement popup; else exec "${HERDR_PLUGIN_ROOT:?HERDR_PLUGIN_ROOT unset}/bin/forward" list; fi']

[[actions]]
id = "doctor"
title = "Port Forward: Doctor (check tunnels)"
command = ["/bin/sh", "-c", 'exec "${HERDR_PLUGIN_ROOT:?HERDR_PLUGIN_ROOT unset}/bin/forward" doctor']

# link_handler 的 action 必须指向本插件已声明的 action（SCOUT-FACTS §2.2），
# 故单独声明 open-url：Ctrl+click localhost 链接 → 有 client 经桥接 attach 时先把端口
# 映射到 client 再请它在自己的浏览器里打开（A.3.3），否则用本机浏览器打开。
[[actions]]
id = "open-url"
title = "Port Forward: Open link in browser"
command = ["/bin/sh", "-c", 'exec "${HERDR_PLUGIN_ROOT:?HERDR_PLUGIN_ROOT unset}/bin/forward" open-url']

# bootstrap —— OOTB 一键装 UI（tab bar 状态条 + 键绑定）。
# 用户 link 后可在任意 pane 执行：
#   herdr plugin action invoke bootstrap --plugin zzjcool:forward
# 实际实现是 scripts/bootstrap.sh（幂等，装过就跳过）；两个 UI 落点都属于 herdr
# 自己的 config.toml，manifest v1 无法声明（SCOUT-FACTS §2.2），故用 action 触发。
[[actions]]
id = "bootstrap"
title = "Port Forward: Setup UI"
command = ["/bin/sh", "-c", 'exec "${HERDR_PLUGIN_ROOT:?HERDR_PLUGIN_ROOT unset}/bin/forward" bootstrap']

# ---------------------------------------------------------------------------
# panes —— Port Forward 面板（表格 + 交互式增删）
# ---------------------------------------------------------------------------

# 面板一行约 70 列：默认的半屏 popup 会把行折断，给足宽高。
[[panes]]
id = "ports"
title = "Port Forward"
placement = "popup"
width = "80%"
height = "80%"
command = ["/bin/sh", "-c", 'exec "${HERDR_PLUGIN_ROOT:?HERDR_PLUGIN_ROOT unset}/bin/forward" watch']

# ---------------------------------------------------------------------------
# link_handlers —— Ctrl+click 本地链接打开浏览器
#
# pattern 是 **Rust regex**，匹配 clicked URL；herdr 的 URL 检测只认 http:// / https://
# （SCOUT-FACTS §2.3）—— 无 scheme 的 `localhost:3000` 不命中，故 pattern 必须带 scheme。
# 定稿（与 tests/unit/test_link_pattern.sh 冻结常量一致）：
#   ^https?://(?:localhost|127\.0\.0\.1)(?::\d{1,5})?(?:[/?#].*)?$
# 用 TOML literal string：basic string 会吞掉 `\d` / `\.`。
# ---------------------------------------------------------------------------

[[link_handlers]]
id = "local-url"
title = "Open localhost URL in browser"
pattern = '^https?://(?:localhost|127\.0\.0\.1)(?::\d{1,5})?(?:[/?#].*)?$'
action = "open-url"
